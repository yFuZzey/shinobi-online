name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Montar projeto Android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node ajustar-android.js
          npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../shinobi-online.apk
      - name: Publicar para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Shinobi Online (build ${{ github.run_number }})
          body: Toque em shinobi-online.apk para baixar e instalar.
          files: shinobi-online.apk
