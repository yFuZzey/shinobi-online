name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  teste-online:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar servidor online (Supabase)
        run: |
          URL=$(node -p "require('./online.json').url")
          KEY=$(node -p "require('./online.json').key")
          node tests/smoke.mjs "$URL" "$KEY"

  teste-servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar servidor do jogo (Render)
        run: |
          SB=$(node -p "require('./online.json').url")
          KEY=$(node -p "require('./online.json').key")
          GS=$(node -p "require('./online.json').gs||''")
          if [ -z "$GS" ]; then echo "::warning::servidor do jogo ainda não configurado"; exit 0; fi
          node tests/smoke.mjs "$SB" "$KEY" > /dev/null || true
          # o Render só atualiza quando a pasta server muda: espera a versão do último envio que mexeu nela
          EXP=$(git log -1 --format=%H -- server)
          # salvar uma variável no Render reinstala a versão mais nova: qualquer envio a partir de EXP serve
          OKS="$EXP,$(git rev-list $EXP..HEAD | paste -sd, -)"
          echo "versões aceitas do servidor: $OKS"
          node tests/server_smoke.mjs "$SB" "$KEY" "$GS" "$OKS"

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Montar projeto Android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node ajustar-android.js
          npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../shinobi-online.apk
      - name: Publicar para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Shinobi Online (build ${{ github.run_number }})
          body: Toque em shinobi-online.apk para baixar e instalar.
          files: shinobi-online.apk

  site:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar site
        run: mkdir -p site && cp www/index.html site/index.html && touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
